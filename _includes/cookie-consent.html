<!-- Cookie consent banner (#109) -->
<div id="cookie-consent" style="display:none; position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,.85); color:#fff; padding:16px 24px; z-index:9999; font-size:14px;">
  <div style="max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
    <span>Situs ini menggunakan cookie untuk analytics dan iklan.</span>
    <div style="margin-left:auto; display:flex; gap:8px; flex-shrink:0;">
      <button id="consent-accept" style="background:#28a745; color:#fff; border:none; padding:6px 18px; border-radius:4px; cursor:pointer; font-weight:600;">Setuju</button>
      <button id="consent-reject" style="background:#dc3545; color:#fff; border:none; padding:6px 18px; border-radius:4px; cursor:pointer;">Tolak</button>
    </div>
  </div>
</div>
<script>
(function() {
  var key = 'helmi-consent';
  var val = localStorage.getItem(key);
  if (val) { return; }
  document.getElementById('cookie-consent').style.display = 'block';
  document.getElementById('consent-accept').onclick = function() {
    localStorage.setItem(key, 'granted');
    location.reload();
  };
  document.getElementById('consent-reject').onclick = function() {
    localStorage.setItem(key, 'denied');
    document.getElementById('cookie-consent').style.display = 'none';
  };
})();
</script>
